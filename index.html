<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiffGIF - Professional Image Comparison</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc',
                400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1',
                800: '#075985', 900: '#0c4a6e',
              }
            }
          }
        }
      }
    </script>

    <!-- 2. GIF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <!-- 3. Babel (Enables in-browser JSX/TS compilation) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body { background-color: #0f172a; color: #f8fafc; margin: 0; font-family: 'Inter', sans-serif; }
      .spinner { width: 40px; height: 40px; border: 4px solid #1e293b; border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      
      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div class="spinner"></div>
            <p style="margin-top:1rem;color:#64748b;">Initializing DiffGIF Studio...</p>
        </div>
    </div>

    <!-- 4. Core Application Logic -->
    <script type="text/babel" data-type="module" data-presets="react,typescript">
        import React, { useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Download, Sparkles, Layers, Zap, Clock, Image as ImageIcon, Settings, 
          ScanLine, Eye, Monitor, Feather, Film, Crop, FileDigit, Upload, X, 
          Type, Palette, LayoutTemplate, MousePointer2, Move, Camera
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- GIF Worker Hack (Fixes Vercel/Cross-Origin Issues) ---
        const workerBlob = new Blob([`importScripts('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')`], { type: 'application/javascript' });
        const workerUrl = window.URL.createObjectURL(workerBlob);

        // --- Types & Interfaces (Kept for Structure/Readability) ---
        // Babel Standalone with typescript preset handles these gracefully.
        
        type AnimationMode = 'blink' | 'slider';
        interface ElementPosition { x: number; y: number; }
        interface PosterConfig {
          enabled: boolean;
          title: string;
          subtitle: string;
          backgroundColor: string;
          textColor: string;
          fontFamily: string;
          titleFontSize: number;
          subtitleFontSize: number;
          posterAspectRatio: '1:1' | '9:16' | '16:9' | '4:5' | '3:4' | '4:3' | '21:9';
          titlePos: ElementPosition;
          subtitlePos: ElementPosition;
          imagePos: ElementPosition;
          imageScale: number;
        }
        interface GifOptions {
          mode: AnimationMode;
          delay: number;
          quality: number;
          fps: number;
          widthType: 'original' | '1920' | '1280' | '854';
          aspectRatio: 'original' | '16:9' | '21:9' | '4:3' | '1:1' | '3:4' | '4:5' | '9:16';
          poster?: PosterConfig;
        }
        interface ImageFile {
          id: string;
          file: File;
          previewUrl: string;
          width: number;
          height: number;
        }

        // --- Utils: GIF Generator ---

        const loadImage = (url) => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous'; 
            img.onload = () => resolve(img);
            img.onerror = (e) => reject(new Error(`Failed to load image.`));
            img.src = url;
          });
        };

        const drawImageCover = (ctx, img, x, y, width, height) => {
          const imgWidth = img.naturalWidth;
          const imgHeight = img.naturalHeight;
          if (!imgWidth || !imgHeight) return;

          const scale = Math.max(width / imgWidth, height / imgHeight);
          const scaledWidth = imgWidth * scale;
          const scaledHeight = imgHeight * scale;
          const drawX = x + (width - scaledWidth) / 2;
          const drawY = y + (height - scaledHeight) / 2;
          
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, width, height);
          ctx.clip();
          ctx.drawImage(img, drawX, drawY, scaledWidth, scaledHeight);
          ctx.restore();
        };

        const generateGif = async (imageAUrl, imageBUrl, options, onProgress) => {
          if (typeof window.GIF === 'undefined') {
            throw new Error('GIF.js library is missing.');
          }

          const [imgA, imgB] = await Promise.all([loadImage(imageAUrl), loadImage(imageBUrl)]);

          // 1. Setup Dimensions
          let canvasWidth = 1080;
          let canvasHeight = 1080;

          if (options.poster && options.poster.enabled) {
            const [w, h] = options.poster.posterAspectRatio.split(':').map(Number);
            if (options.widthType !== 'original') canvasWidth = parseInt(options.widthType);
            canvasHeight = Math.round(canvasWidth * (h / w));
          } else {
            const originalWidth = imgA.naturalWidth || 1080;
            const originalHeight = imgA.naturalHeight || 1080;
            let targetRatio = originalWidth / originalHeight;
            if (options.aspectRatio !== 'original') {
              const [w, h] = options.aspectRatio.split(':').map(Number);
              targetRatio = w / h;
            }
            canvasWidth = options.widthType !== 'original' ? parseInt(options.widthType) : originalWidth;
            canvasHeight = Math.round(canvasWidth / targetRatio);
          }

          // 2. Content Box
          let contentWidth = canvasWidth;
          let contentHeight = canvasHeight;
          let contentX = 0;
          let contentY = 0;

          let animTargetRatio = (imgA.naturalWidth || 1) / (imgA.naturalHeight || 1);
          if (options.aspectRatio !== 'original') {
            const [w, h] = options.aspectRatio.split(':').map(Number);
            animTargetRatio = w / h;
          }
          contentHeight = contentWidth / animTargetRatio;

          if (options.poster && options.poster.enabled) {
             const scale = options.poster.imageScale;
             contentWidth = contentWidth * scale;
             contentHeight = contentHeight * scale;
             contentX = (canvasWidth * options.poster.imagePos.x) - (contentWidth / 2);
             contentY = (canvasHeight * options.poster.imagePos.y) - (contentHeight / 2);
          }

          // 3. Canvas
          const canvas = document.createElement('canvas');
          canvas.width = canvasWidth;
          canvas.height = canvasHeight;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          const drawContent = (img) => {
            drawImageCover(ctx, img, contentX, contentY, contentWidth, contentHeight);
          };

          // 4. GIF Encoder
          const gif = new window.GIF({
            workers: 4,
            quality: options.quality,
            width: canvasWidth,
            height: canvasHeight,
            workerScript: workerUrl, // Use blob URL
            background: options.poster?.enabled ? options.poster.backgroundColor : '#000000',
          });

          // 5. Draw Frame Logic
          const drawFrame = (imgToDraw, splitProgress) => {
              // Background
              ctx.fillStyle = options.poster?.enabled ? options.poster.backgroundColor : '#000000';
              ctx.fillRect(0, 0, canvasWidth, canvasHeight);

              // Image
              if (splitProgress === null) {
                 if (imgToDraw) drawContent(imgToDraw);
              } else {
                 drawContent(imgA);
                 const relativeSplitX = contentX + (contentWidth * splitProgress);
                 ctx.save();
                 ctx.beginPath();
                 ctx.rect(contentX, contentY, Math.max(0, contentWidth * splitProgress), contentHeight);
                 ctx.clip();
                 drawContent(imgB);
                 ctx.restore();

                 if (splitProgress > 0 && splitProgress < 1) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillRect(relativeSplitX - 2, contentY, 4, contentHeight);
                 }
              }

              // Text
              if (options.poster?.enabled) {
                  const config = options.poster;
                  const scaleFactor = canvasWidth / 1080;
                  const titleSize = Math.max(10, Math.round(config.titleFontSize * scaleFactor));
                  const subtitleSize = Math.max(10, Math.round(config.subtitleFontSize * scaleFactor));
                  const fontName = config.fontFamily;

                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillStyle = config.textColor;

                  if (config.title) {
                    ctx.font = `bold ${titleSize}px ${fontName}`;
                    ctx.fillText(config.title, canvasWidth * config.titlePos.x, canvasHeight * config.titlePos.y);
                  }
                  if (config.subtitle) {
                    ctx.font = `${subtitleSize}px ${fontName}`;
                    ctx.fillText(config.subtitle, canvasWidth * config.subtitlePos.x, canvasHeight * config.subtitlePos.y);
                  }
              }
          };

          if (options.mode === 'blink') {
            drawFrame(imgA, null);
            gif.addFrame(ctx, { copy: true, delay: options.delay });
            drawFrame(imgB, null);
            gif.addFrame(ctx, { copy: true, delay: options.delay });
          } else if (options.mode === 'slider') {
            const slideDuration = 1500;
            const totalFrames = Math.floor(slideDuration / (1000 / options.fps));
            drawFrame(imgA, null);
            gif.addFrame(ctx, { copy: true, delay: options.delay });
            for (let i = 0; i <= totalFrames; i++) {
              drawFrame(null, i / totalFrames);
              gif.addFrame(ctx, { copy: true, delay: 1000 / options.fps });
            }
            drawFrame(imgB, null);
            gif.addFrame(ctx, { copy: true, delay: options.delay });
          }

          return new Promise((resolve, reject) => {
            gif.on('progress', (p) => onProgress(Math.round(p * 100)));
            gif.on('finished', (blob) => resolve(blob));
            gif.on('abort', () => reject(new Error('Aborted')));
            gif.render();
          });
        };

        // --- Component: Dropzone ---

        const Dropzone = ({ label, image, onImageSelect, onRemove, colorClass }) => {
          const inputRef = useRef(null);
          const [isDragging, setIsDragging] = useState(false);

          const handleDrop = (e) => {
            e.preventDefault();
            setIsDragging(false);
            if (e.dataTransfer.files?.[0]?.type.startsWith('image/')) {
              onImageSelect(e.dataTransfer.files[0]);
            }
          };

          const handleChange = (e) => {
            if (e.target.files?.[0]) onImageSelect(e.target.files[0]);
          };

          return (
            <div className="flex flex-col gap-2 w-full">
              <span className={`text-sm font-semibold uppercase tracking-wider ${colorClass}`}>{label}</span>
              <div
                onClick={() => !image && inputRef.current?.click()}
                onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                onDragLeave={() => setIsDragging(false)}
                onDrop={handleDrop}
                className={`relative w-full aspect-[4/3] rounded-xl border-2 border-dashed transition-all duration-300 cursor-pointer overflow-hidden group
                  ${image ? 'border-transparent bg-slate-800' : 'hover:border-slate-500'}
                  ${isDragging ? 'border-brand-400 bg-brand-500/10' : 'border-slate-700 bg-slate-800/50'}`}
              >
                <input type="file" ref={inputRef} onChange={handleChange} accept="image/*" className="hidden" />
                {image ? (
                  <>
                    <img src={image.previewUrl} alt={label} className="w-full h-full object-contain" />
                    <button onClick={(e) => { e.stopPropagation(); onRemove(); }} className="absolute top-2 right-2 p-1.5 bg-red-500/80 hover:bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                      <X size={16} />
                    </button>
                    <div className="absolute bottom-0 inset-x-0 p-2 bg-gradient-to-t from-black/80 opacity-0 group-hover:opacity-100 transition-opacity text-xs text-white flex justify-between">
                       <span className="truncate max-w-[70%]">{image.file.name}</span>
                       <span>{image.width}x{image.height}</span>
                    </div>
                  </>
                ) : (
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400 p-4">
                    <div className="p-4 rounded-full bg-slate-800/80 mb-3 group-hover:scale-110 transition-transform"><Upload size={24} className={isDragging ? 'text-brand-400' : ''} /></div>
                    <p className="text-sm font-medium">Click to upload</p>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // --- Component: PosterEditor ---

        const PosterEditor = ({ imgA, imgB, baseOptions }) => {
          const [config, setConfig] = useState({
            enabled: true,
            title: 'BEFORE & AFTER',
            subtitle: '@DiffGIF',
            backgroundColor: '#000000',
            textColor: '#FFFFFF',
            fontFamily: 'Inter, sans-serif',
            titleFontSize: 80,
            subtitleFontSize: 30,
            posterAspectRatio: '1:1',
            titlePos: { x: 0.5, y: 0.1 },
            subtitlePos: { x: 0.85, y: 0.95 },
            imagePos: { x: 0.5, y: 0.5 },
            imageScale: 0.8,
          });

          const [generating, setGenerating] = useState(false);
          const [progress, setProgress] = useState(0);
          const [posterUrl, setPosterUrl] = useState(null);
          const previewCanvasRef = useRef(null);
          const [draggingItem, setDraggingItem] = useState(null);

          const renderPreview = async () => {
            const canvas = previewCanvasRef.current;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const previewWidth = 600;
            const [rw, rh] = config.posterAspectRatio.split(':').map(Number);
            canvas.width = previewWidth;
            canvas.height = Math.round(previewWidth * (rh / rw));

            ctx.fillStyle = config.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Image Mockup
            if (imgA) {
               const img = new Image();
               img.crossOrigin = 'anonymous';
               img.src = imgA.previewUrl;
               // In a real app we'd wait for load, here we assume cached or fast enough for loop
               if (img.complete) {
                  const animRatio = (baseOptions.aspectRatio !== 'original') ? (baseOptions.aspectRatio.split(':').map(Number).reduce((a,b)=>a/b)) : (img.naturalWidth/img.naturalHeight);
                  const scaledW = previewWidth * config.imageScale;
                  const scaledH = (previewWidth / animRatio) * config.imageScale;
                  const dx = (canvas.width * config.imagePos.x) - (scaledW/2);
                  const dy = (canvas.height * config.imagePos.y) - (scaledH/2);
                  
                  ctx.save();
                  ctx.beginPath();
                  ctx.rect(dx, dy, scaledW, scaledH);
                  ctx.clip();
                  ctx.drawImage(img, dx, dy, scaledW, scaledH);
                  ctx.restore();
                  
                  if (draggingItem === 'image') {
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.strokeRect(dx, dy, scaledW, scaledH);
                  }
               }
            }

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = config.textColor;
            const scale = canvas.width / 1080;
            
            if (config.title) {
                ctx.font = `bold ${Math.round(config.titleFontSize * scale)}px ${config.fontFamily}`;
                ctx.fillText(config.title, canvas.width * config.titlePos.x, canvas.height * config.titlePos.y);
            }
            if (config.subtitle) {
                ctx.font = `${Math.round(config.subtitleFontSize * scale)}px ${config.fontFamily}`;
                ctx.fillText(config.subtitle, canvas.width * config.subtitlePos.x, canvas.height * config.subtitlePos.y);
            }
          };

          useEffect(() => { renderPreview(); }, [config, imgA, baseOptions.aspectRatio, draggingItem]);

          const getMousePos = (e) => {
              const rect = previewCanvasRef.current.getBoundingClientRect();
              return { x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width, h: rect.height };
          };
          
          const handleMouseDown = (e) => {
              const { x, y, w, h } = getMousePos(e);
              const nx = x/w, ny = y/h;
              if (Math.hypot(nx - config.titlePos.x, ny - config.titlePos.y) < 0.1) setDraggingItem('title');
              else if (Math.hypot(nx - config.subtitlePos.x, ny - config.subtitlePos.y) < 0.1) setDraggingItem('subtitle');
              else if (Math.hypot(nx - config.imagePos.x, ny - config.imagePos.y) < 0.3) setDraggingItem('image');
          };
          
          const handleMouseMove = (e) => {
              if (!draggingItem) return;
              const { x, y, w, h } = getMousePos(e);
              const newPos = { x: Math.max(0, Math.min(1, x/w)), y: Math.max(0, Math.min(1, y/h)) };
              if (draggingItem === 'title') setConfig(c => ({...c, titlePos: newPos}));
              else if (draggingItem === 'subtitle') setConfig(c => ({...c, subtitlePos: newPos}));
              else if (draggingItem === 'image') setConfig(c => ({...c, imagePos: newPos}));
          };

          const handleGenerate = async () => {
             if (!imgA || !imgB) return;
             setGenerating(true); setProgress(0); setPosterUrl(null);
             try {
                const blob = await generateGif(imgA.previewUrl, imgB.previewUrl, { ...baseOptions, poster: config }, setProgress);
                setPosterUrl(URL.createObjectURL(blob));
             } catch(e) { alert('Error: ' + e.message); }
             setGenerating(false);
          };

          return (
            <div className="w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mt-8">
              <div className="flex items-center gap-3 mb-6">
                <div className="p-2 bg-gradient-to-br from-orange-500 to-pink-600 rounded-lg text-white"><LayoutTemplate size={20} /></div>
                <div><h2 className="text-xl font-bold text-white">Poster Studio</h2><p className="text-slate-400 text-xs">Drag elements to arrange.</p></div>
              </div>
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                 <div className="lg:col-span-4 space-y-4">
                    <input type="text" value={config.title} onChange={e => setConfig({...config, title: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white" placeholder="Title" />
                    <input type="text" value={config.subtitle} onChange={e => setConfig({...config, subtitle: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm text-white" placeholder="Subtitle" />
                    <div className="flex gap-2">
                        <input type="color" value={config.backgroundColor} onChange={e => setConfig({...config, backgroundColor: e.target.value})} className="h-8 w-full cursor-pointer" />
                        <input type="color" value={config.textColor} onChange={e => setConfig({...config, textColor: e.target.value})} className="h-8 w-full cursor-pointer" />
                    </div>
                    <div className="flex gap-2 text-xs text-slate-400">
                        {['1:1','4:5','16:9'].map(r => <button key={r} onClick={() => setConfig({...config, posterAspectRatio: r})} className={`p-1 border rounded ${config.posterAspectRatio === r ? 'bg-pink-500 text-white' : ''}`}>{r}</button>)}
                    </div>
                    <button onClick={handleGenerate} disabled={generating || !imgA} className="w-full py-3 bg-white text-black font-bold rounded-xl hover:bg-slate-200 disabled:opacity-50">
                        {generating ? `Rendering ${progress}%` : 'Render Poster GIF'}
                    </button>
                 </div>
                 <div className="lg:col-span-8 bg-slate-950/50 rounded-xl border border-slate-800 p-4 flex flex-col items-center justify-center min-h-[400px]">
                    {posterUrl ? (
                        <div className="flex flex-col items-center gap-4">
                            <img src={posterUrl} className="max-w-full max-h-[50vh] object-contain shadow-xl" />
                            <div className="flex gap-2">
                                <button onClick={() => setPosterUrl(null)} className="px-4 py-2 bg-slate-800 rounded text-white text-sm">Edit</button>
                                <a href={posterUrl} download={`poster-${Date.now()}.gif`} className="px-4 py-2 bg-green-600 rounded text-white text-sm flex gap-2 items-center"><Download size={16}/> Download</a>
                            </div>
                        </div>
                    ) : (
                        <div className={`relative shadow-2xl border border-slate-700 overflow-hidden ${draggingItem ? 'cursor-grabbing' : 'cursor-grab'}`}>
                           <canvas ref={previewCanvasRef} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={() => setDraggingItem(null)} onMouseLeave={() => setDraggingItem(null)} className="block max-w-full max-h-[50vh] bg-black" />
                        </div>
                    )}
                 </div>
              </div>
            </div>
          );
        };

        // --- Main Component: App ---

        function App() {
          const [imgA, setImgA] = useState(null);
          const [imgB, setImgB] = useState(null);
          const [generating, setGenerating] = useState(false);
          const [progress, setProgress] = useState(0);
          const [gifUrl, setGifUrl] = useState(null);
          const [fileSize, setFileSize] = useState(null);
          
          const [options, setOptions] = useState({
            mode: 'slider', delay: 1000, quality: 2, fps: 25, widthType: 'original', aspectRatio: 'original'
          });

          const handleImageSelect = useCallback((file, type) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
              const data = { id: Math.random().toString(36), file, previewUrl: url, width: img.naturalWidth, height: img.naturalHeight };
              if (type === 'A') setImgA(data); else setImgB(data);
            };
            img.src = url;
          }, []);

          const handleGenerate = async () => {
            if (!imgA || !imgB) return;
            setGenerating(true); setProgress(0); setGifUrl(null); setFileSize(null);
            try {
              // Delay to let UI render loader
              await new Promise(r => setTimeout(r, 100));
              const blob = await generateGif(imgA.previewUrl, imgB.previewUrl, options, setProgress);
              setGifUrl(URL.createObjectURL(blob));
              setFileSize((blob.size / 1024 / 1024).toFixed(2));
            } catch (err) { alert('Generation failed: ' + err.message); }
            setGenerating(false);
          };

          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-12">
              <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
                <div className="max-w-6xl mx-auto px-4 h-16 flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-brand-500 flex items-center justify-center text-white"><Layers size={18} /></div>
                  <h1 className="text-xl font-bold">DiffGIF <span className="text-xs font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full ml-2">Single File</span></h1>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 py-8 space-y-12">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  <div className="lg:col-span-5 space-y-6">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
                       <h2 className="flex items-center gap-2 text-md font-semibold text-slate-200"><ImageIcon size={18} className="text-brand-400" /> Source Images</h2>
                       <div className="grid grid-cols-2 gap-4">
                         <Dropzone label="Before (Left)" colorClass="text-blue-400" image={imgA} onImageSelect={(f) => handleImageSelect(f, 'A')} onRemove={() => setImgA(null)} />
                         <Dropzone label="After (Right)" colorClass="text-purple-400" image={imgB} onImageSelect={(f) => handleImageSelect(f, 'B')} onRemove={() => setImgB(null)} />
                       </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-6">
                      <h2 className="flex items-center gap-2 text-md font-semibold text-slate-200"><Settings size={18} className="text-brand-400" /> Settings</h2>
                      <div className="space-y-4">
                         <div>
                            <label className="text-xs text-slate-400 uppercase font-medium">Mode</label>
                            <div className="grid grid-cols-2 gap-2 mt-1">
                               <button onClick={() => setOptions(o => ({...o, mode: 'slider'}))} className={`py-2 rounded text-sm ${options.mode === 'slider' ? 'bg-slate-700 text-white' : 'text-slate-500 bg-slate-950'}`}>Slider</button>
                               <button onClick={() => setOptions(o => ({...o, mode: 'blink'}))} className={`py-2 rounded text-sm ${options.mode === 'blink' ? 'bg-slate-700 text-white' : 'text-slate-500 bg-slate-950'}`}>Blink</button>
                            </div>
                         </div>
                         <div>
                            <label className="text-xs text-slate-400 uppercase font-medium flex justify-between"><span>Duration</span> <span className="text-brand-400">{options.delay}ms</span></label>
                            <input type="range" min="200" max="3000" step="100" value={options.delay} onChange={(e) => setOptions(o => ({...o, delay: Number(e.target.value)}))} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-500 mt-2" />
                         </div>
                         <div>
                             <label className="text-xs text-slate-400 uppercase font-medium">Ratio</label>
                             <div className="flex gap-2 mt-1">
                                {['original','1:1','16:9'].map(r => (
                                    <button key={r} onClick={() => setOptions(o => ({...o, aspectRatio: r}))} className={`px-2 py-1 rounded text-xs border ${options.aspectRatio === r ? 'border-brand-500 text-brand-400' : 'border-slate-700 text-slate-500'}`}>{r}</button>
                                ))}
                             </div>
                         </div>
                      </div>
                    </div>

                    <button onClick={handleGenerate} disabled={!imgA || !imgB || generating} className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-3 transition-all ${(!imgA || !imgB) ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-brand-600 to-brand-500 text-white hover:scale-[1.02]'}`}>
                      {generating ? `Rendering ${progress}%` : <><Zap size={20} /> Generate GIF</>}
                    </button>
                  </div>

                  <div className="lg:col-span-7 flex flex-col gap-6">
                    <div className="flex-1 min-h-[500px] bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden">
                       {gifUrl ? (
                         <img src={gifUrl} alt="Result" className="max-w-full max-h-[70vh] object-contain rounded-lg shadow-2xl" />
                       ) : (
                         <div className="text-center z-10 p-8 opacity-30"><Sparkles size={48} className="text-slate-600 mx-auto mb-4" /><p className="text-xl text-slate-400">Ready to generate</p></div>
                       )}
                    </div>
                    {gifUrl && (
                      <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex items-center justify-between">
                         <div className="text-sm text-slate-400">Size: <span className="text-brand-300">{fileSize} MB</span></div>
                         <div className="flex gap-3">
                           <button onClick={() => setGifUrl(null)} className="px-4 py-2 border border-slate-700 rounded text-slate-300">Discard</button>
                           <a href={gifUrl} download={`diffgif-${Date.now()}.gif`} className="px-6 py-2 bg-green-600 hover:bg-green-500 text-white rounded shadow-lg flex items-center gap-2"><Download size={18} /> Download</a>
                         </div>
                      </div>
                    )}
                  </div>
                </div>
                
                <PosterEditor imgA={imgA} imgB={imgB} baseOptions={options} />
              </main>
            </div>
          );
        }
        
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
