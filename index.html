<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiffGIF - Create Comparison GIFs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load GIF.js library from CDN (Global Scope) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    
    <!-- Preconnect to CDNs for faster loading -->
    <link rel="preconnect" href="https://esm.sh" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #f8fafc;
        margin: 0;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Loading Spinner Styles */
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0f172a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #1e293b;
        border-top: 4px solid #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error-message {
        color: #ef4444;
        background: rgba(239, 68, 68, 0.1);
        padding: 1rem;
        border-radius: 0.5rem;
        margin-top: 1rem;
        max-width: 80%;
        text-align: center;
        font-family: monospace;
        display: none;
      }
    </style>
    
    <!-- 
      FIXED IMPORTMAP:
      Strictly uses esm.sh public CDN. 
      All internal/private domains have been removed.
    -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.3.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/"
  }
}
</script>
  </head>
  <body>
    <div id="root">
      <!-- Initial Loading State -->
      <div id="loader" class="initial-loader">
        <div class="spinner"></div>
        <p style="margin-top: 16px; color: #64748b; font-size: 0.875rem;">Loading DiffGIF...</p>
        <div id="error-display" class="error-message"></div>
      </div>
    </div>

    <!-- Fallback: If app doesn't load in 5 seconds, show error -->
    <script>
      window.addEventListener('error', function(event) {
        const loader = document.getElementById('loader');
        const errorDisplay = document.getElementById('error-display');
        const spinner = loader.querySelector('.spinner');
        if (loader && errorDisplay) {
          spinner.style.display = 'none';
          errorDisplay.style.display = 'block';
          errorDisplay.innerText = 'Error: ' + event.message;
        }
      });

      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader && loader.style.opacity !== '0') {
           // Check if root is empty (meaning React didn't render)
           const root = document.getElementById('root');
           if (root && root.children.length <= 1) { // 1 because loader is inside root
             const errorDisplay = document.getElementById('error-display');
             const spinner = loader.querySelector('.spinner');
             if (spinner) spinner.style.display = 'none';
             if (errorDisplay) {
                errorDisplay.style.display = 'block';
                errorDisplay.innerText = 'Application timeout. Please check console for details.';
             }
           }
        }
      }, 8000);
    </script>
    
    <!-- Explicitly load the entry point module -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
